name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        shell: pwsh
        run: ./test.ps1
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: forbric-boomer
          path: dist/forbric-boomer-1.0.0.jar
